name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\SynopsisBrowser.sln

      - name: Build
        run: dotnet build .\SynopsisBrowser.sln -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish .\src\SynopsisBrowser.App\SynopsisBrowser.App.csproj -c Release -r win-x64 --self-contained true -o .\dist\win-x64

      - name: Upload Synopsis
        uses: actions/upload-artifact@v4
        with:
          name: SynopsisBrowser-win-x64
          path: .\dist\win-x64\
